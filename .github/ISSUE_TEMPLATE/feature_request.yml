name: Feature request
description: Suggest something this project should be able to do.
title: "[Feature]: "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Good feature requests start with a problem, not a solution. Tell us what
        you were trying to do and what got in the way — the best design often
        turns out to be something neither of us had thought of.

        For open-ended ideas and "would you ever consider…" questions,
        [Discussions](https://github.com/iampopye/chatbot/discussions) is a
        better fit than an issue.

        One scoping note: this project is deliberately not trying to be the
        upstream [Vercel AI Chatbot](https://github.com/vercel/ai-chatbot)
        template. Requests that serve people self-hosting the app land best.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you file
      options:
        - label: I searched existing issues and this has not already been requested.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation you hit, not the feature you want yet.
      placeholder: |
        I run this for a small team behind our VPN. Anyone who reaches the app
        can create an account, and I have no way to restrict sign-ups to our
        own email domain.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
      description: Your proposed solution, if you have one.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part would this touch?
      options:
        - Model providers / provider configuration
        - Chat experience
        - Artifacts (code, text, sheet, image)
        - Authentication and accounts
        - Self-hosting, Docker or deployment
        - Storage and file uploads
        - Database
        - Documentation
        - Not sure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What are you doing instead today?
      description: |
        Workarounds, a patch you keep locally, or another tool you use for this.
        This is genuinely useful — it tells us how much the gap actually costs.

  - type: checkboxes
    id: considerations
    attributes:
      label: Does this involve any of these?
      description: None of these are blockers — they just mean the design needs more care.
      options:
        - label: A new required environment variable or configuration.
        - label: A new third-party service or dependency.
        - label: A database schema change.
        - label: Something that must keep working when the app is fully offline (local model, no internet).

  - type: checkboxes
    id: help
    attributes:
      label: Would you like to help build it?
      options:
        - label: I'd be interested in opening a pull request for this.
        - label: I'd be happy to test it on my own deployment.
