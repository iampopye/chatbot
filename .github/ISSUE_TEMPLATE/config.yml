    about: Not sure it's a bug? Ask in Discussions — self-hosting help, provider setup, "how do I…", and open-ended ideas all belong there.
  - name: Report a security vulnerability
    url: https://github.com/iampopye/chatbot/blob/main/SECURITY.md
