  - name: Commercial licence enquiry
    url: https://github.com/iampopye/chatbot/blob/main/COMMERCIAL.md
    about: If the AGPL's source-sharing obligation does not work for your organisation, start here.
  - name: Issue with the upstream Vercel template
    url: https://github.com/vercel/ai-chatbot/issues
    about: This project derives from Vercel's AI Chatbot template. If the problem reproduces there too, it is best reported upstream as well.
