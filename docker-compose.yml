# =============================================================================
# Self-Hosted AI Chat
#
#   cp .env.example .env      # set AUTH_SECRET and at least one provider key
#   docker compose up -d
#
# The app is then on http://localhost:3000
# =============================================================================

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Not published by default: the database should not be reachable from
    # outside the compose network. Uncomment only if you need direct access.
    # ports:
    #   - "127.0.0.1:5432:5432"

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Everything the app needs comes from .env - no secret is baked into the
    # image. Values set here win over .env.
    env_file:
      - .env
    environment:
      POSTGRES_URL: postgres://chat:chat@postgres:5432/chat
    ports:
      - "3000:3000"
    # Lets OPENAI_COMPATIBLE_BASE_URL point at a model server running on the
    # host, e.g. Ollama on http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
